# Runs the testthat suite (tests/testthat) on every push and pull request.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # binary packages, much faster installs

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The app is not an R package (no DESCRIPTION), so the packages
          # from dependencies.R plus testthat are listed here
          packages: |
            any::shiny
            any::lpSolve
            any::tidyverse
            any::DT
            any::gridExtra
            any::testthat

      # pdftotext lets the report tests check the text of generated PDFs
      - name: Install poppler-utils
        run: sudo apt-get install -y poppler-utils

      - name: Run tests
        run: Rscript tests/run_tests.R
